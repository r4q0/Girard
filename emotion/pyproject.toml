[project]
name = "girard-emotion"
version = "0.1.0"
description = "Girard emotion engine: the prospect's mood from the largest face on screen and from what they say. Runs locally."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "mss>=9.0",
    "tokenizers>=0.20",
]

[tool.uv]
package = false
